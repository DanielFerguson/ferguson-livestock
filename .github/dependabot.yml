version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      laravel:
        patterns: ['laravel/*', 'livewire/*', 'filament/*']
      testing:
        patterns: ['pestphp/*', 'phpunit/*', 'larastan/*', 'phpstan/*', 'rector/*', 'driftingly/*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
